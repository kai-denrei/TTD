name: Deploy to GitHub Pages

# The PoC deployed straight from the repo root because it had no build step.
# TTD is a Vite app, so Pages is fed from dist/ by this workflow instead.
# DEPLOY_BASE makes vite emit sub-path-correct asset URLs for /TTD/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the pure core
        run: npm test
      - name: Build
        env:
          DEPLOY_BASE: /TTD/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
